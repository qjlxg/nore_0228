name: backtest_fusion_scanner

on:
  push:
    paths:
      - 'backtest_fusion_scanner.py'
      - '.github/workflows/backtest_fusion_scanner.yml'
  schedule:
    # 北京时间 16:30 运行 (对应 UTC 08:30)
    - cron: '30 8 * * *'
  workflow_dispatch: # 支持手动运行

jobs:
  scan_and_report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
         

      - name: 安装依赖
        run: |
          pip install pandas numpy pytz tabulate

      - name: 执行极速扫描脚本
        run: |
          # 确保数据目录存在（即便为空也不报错）
          mkdir -p stock_data
          python backtest_fusion_scanner.py

      - name: 自动提交扫描结果
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add results/*.csv
          # 只有在有新文件生成时才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 自动生成选股报告 $(date +'%Y-%m-%d %H:%M')" && git push)
