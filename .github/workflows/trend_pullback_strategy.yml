name: trend_pullback_strategy

on:
  push:
    paths:
      - 'trend_pullback_strategy.py'
      - '.github/workflows/trend_pullback_strategy.yml'
  schedule:

    - cron: '3 8 * * *'
  workflow_dispatch: # 支持手动运行

jobs:
  filter_stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run screening script
        run: python trend_pullback_strategy.py

      - name: Commit and Push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # 只有在有新文件生成时才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock screening results $(date +'%Y-%m-%d %H:%M')" && git push)
